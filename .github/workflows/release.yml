name: Release packages

on:
  workflow_run:
    workflows: ["Quality and deploy"]
    types: [completed]

concurrency:
  group: strawn-release
  cancel-in-progress: false

jobs:
  release-pr:
    name: Prepare release pull request
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.unpublished.outputs.should-publish }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          title: "Release: Strawn packages"
          commit: "Release Strawn packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: unpublished
        name: Detect unpublished package versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/check-unpublished-packages.mjs >> "$GITHUB_OUTPUT"

  publish:
    name: Publish packages
    needs: release-pr
    if: needs.release-pr.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm version
        run: npm install --global npm@11.5.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Publish unpublished versions
        run: bun run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
      - name: Push release tags
        run: git push --follow-tags
